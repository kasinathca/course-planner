[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ffcs-studio"
version = "0.6.0"
description = "Offline-first localhost FFCS planning foundation"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - license decision pending" }
authors = [{ name = "FFCS Studio contributors" }]
dependencies = [
  "fastapi>=0.115,<0.116",
  "jinja2>=3.1,<4",
  "jsonschema[format]>=4.23,<5",
  "uvicorn>=0.30,<0.35",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
ffcs-studio = "ffcs_studio.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ffcs_studio = [
  "py.typed",
  "persistence/schema/*.sql",
  "resources/schemas/*.json",
  "web/templates/*.html",
  "web/static/css/*.css",
  "web/static/js/*.js",
  "web/static/js/modules/*.js",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --basetemp=.tmp"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/ffcs_studio/persistence/degree_repository.py" = ["E501"] # SQL remains grep-friendly.

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ffcs_studio"]
